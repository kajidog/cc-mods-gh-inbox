name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      # With changesets left: open or update the release PR. With none (the release PR merged): tag each
      # version not tagged yet and create its GitHub release from its CHANGELOG. Nothing is published to npm.
      - name: Create or update release PR, or tag the release
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run release:version
          publish-script: npm run release:tag
          commit-message: "chore: release"
          pr-title: "chore: release"
      - run: npm run check:version
