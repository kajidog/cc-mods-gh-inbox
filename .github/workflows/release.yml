name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      # Tags the version on main if it has no tag yet and creates its GitHub release from its CHANGELOG.
      # Run at every push, apart from the release PR: a release PR merged while newer changesets were
      # already on main is tagged too. A version tagged already is skipped. Nothing is published to npm.
      - name: Tag the release
        uses: changesets/action/publish@v2.1.2
        with:
          script: npm run release:tag
      - name: Create or update release PR
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run release:version
          commit-message: "chore: release"
          pr-title: "chore: release"
      - run: npm run check:version
